[project]
name = "corridor"
version = "0.1.0"
description = "Time-aware drone route planner that uses the friendly EW jammer schedule."
authors = [
    { name = "Yoann CORGNET" }
]
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.165.0",
    "numpy>=2.5.5",
    "pydantic>=2.14.4",
    "pyproj>=3.8.0",
    "rasterio>=1.5.2",
    "scipy>=1.18.1",
    "uvicorn>=0.54.0",
    "websockets>=17.4",
]

[project.scripts]
corridor-tak = "corridor.tak.cli:main"
corridor-server = "corridor.adapters.ws.server:main"
corridor-schema = "corridor.adapters.ws.schema:main"
corridor-export = "corridor.export.cli:main"

[build-system]
requires = ["uv_build>=0.10.9,<0.11.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
packages = ["corridor"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["rasterio.*", "scipy.*", "pyproj.*"]
ignore_missing_imports = true

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "ruff>=0.17.6",
]
